# This is for linting. To run it, please use:
# golangci-lint run ${MODULE}/... [--fix]

version: "2"
linters:
  # linters to run in addition to default ones
  enable:
    - copyloopvar
    - dupl
    - dupword
    - durationcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - godot
    - gosec
    - intrange
    - misspell
    - nakedret
    - nolintlint
    - protogetter
    - revive
    - sloglint
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    # Forbid the usage of deprecated ioutil, debug prints, and raw filesystem mutation.
    # Filesystem mutations must go through the securefiles custodian; the allowlist below names
    # the packages that legitimately write outside the public boundary (private state stores,
    # the Landscape installer's temporary/virtual-disk paths, the teardown command, lockfiles,
    # and test files). The agent command package is allowlisted because it sets up the private
    # log there; the sweep test in cmd/ubuntu-pro-agent/agent is what covers it.
    forbidigo:
      forbid:
        - pattern: ioutil\.
          msg: Use the standard library replacements for ioutil.
        - pattern: ^print.*$
          msg: Avoid bare print statements; use logging.
        - pattern: ^os\.Create$
          msg: Use the securefiles custodian for filesystem mutations.
        - pattern: ^os\.OpenFile$
          msg: Use the securefiles custodian for filesystem mutations.
        - pattern: ^os\.WriteFile$
          msg: Use the securefiles custodian for filesystem mutations.
        - pattern: ^os\.Mkdir(All)?$
          msg: Use the securefiles custodian for filesystem mutations.
        - pattern: ^os\.Remove(All)?$
          msg: Use the securefiles custodian for filesystem mutations.
        - pattern: ^os\.Rename$
          msg: Use the securefiles custodian for filesystem mutations.
    # Never have naked return ever
    nakedret:
      max-func-lines: 1
  exclusions:
    generated: lax
    rules:
      # EXC0001 errcheck: most errors are in defer calls, which are safe to ignore and idiomatic Go (would be good to only ignore defer ones though)
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv|w\.Stop). is not checked
      # EXC0008 gosec: duplicated of errcheck
      - path: (.+)\.go$
        text: (G104|G307)
      # EXC0010 gosec: False positive is triggered by 'src, err := ioutil.ReadFile(filename)'
      - path: (.+)\.go$
        text: Potential file inclusion via variable
      # We don't wrap errors on purpose
      - path: (.+)\.go$
        text: non-wrapping format verb for fmt.Errorf. Use `%w` to format errors
      # We want named parameters even if unused, as they help better document the function
      - path: (.+)\.go$
        text: unused-parameter
      # Sometimes it is more readable it do a `if err:=a(); err != nil` than simpy `return a()`
      - path: (.+)\.go$
        text: if-return
      # Outdated warning, it only applies to Go < 1.22
      # G601: Implicit memory aliasing in for loop.
      - path: (.+)\.go$
        text: G601
      # We don't want to rename this package at this point
      - path: common/(.+)\.go$
        text: "var-naming: avoid meaningless package names"
       # SA4009 (argument homedir is overwritten before first use) gives false positives
      - path: (.+)\.go$
        text: SA4009
      # mTLS uses TLS 1.2 intentionally to support Windows 10 hosts.
      - path: '(common[\/]certs[\/](certs|certs_test)|wsl-pro-service[\/]internal[\/]daemon[\/]daemon|wsl-pro-service[\/]internal[\/]testutils[\/]mock_agent|windows-agent[\/]internal[\/]proservices[\/]proservices_test)\.go$'
        text: G402
      # Allow raw filesystem mutation only in the custodian implementation, private state
      # stores, Landscape installer paths outside the boundary, the teardown command,
      # lockfiles, test utilities, and test files.
      - path: .*internal[\/]securefiles[\/].*
        linters: [forbidigo]
      - path: .*internal[\/]config[\/].*
        linters: [forbidigo]
      - path: .*internal[\/]distros[\/]database[\/].*
        linters: [forbidigo]
      - path: .*internal[\/]distros[\/]worker[\/].*
        linters: [forbidigo]
      - path: .*internal[\/]proservices[\/]landscape[\/]distroinstall[\/].*
        linters: [forbidigo]
      - path: .*internal[\/]proservices[\/]landscape[\/]executor\.go$
        linters: [forbidigo]
      - path: .*cmd[\/]ubuntu-pro-agent[\/]agent[\/].*
        linters: [forbidigo]
      - path: .*common[\/]testutils[\/].*
        linters: [forbidigo]
      - path: .*common[\/]wsltestutils[\/].*
        linters: [forbidigo]
      - path: (.+)_test\.go$
        linters: [forbidigo]
      # wsl-pro-service writes the landscape-client configuration inside the WSL distro
      # instance, not on the Windows host's public directory, so the securefiles custodian
      # boundary does not apply there.
      - path: .*wsl-pro-service[\/]internal[\/]system[\/].*
        linters: [forbidigo]
      # wsl-pro-service test helpers construct synthetic distro filesystems; they are not
      # host-side public-directory writes and therefore fall outside the custodian boundary.
      - path: .*wsl-pro-service[\/]internal[\/]testutils[\/].*
        linters: [forbidigo]
      # Mocks are test doubles that run outside the agent's public-directory boundary.
      - path: .*mocks[\/].*
        linters: [forbidigo]
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
